
name: Android AAB (signed build)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install dependencies
        run: npm install --no-audit --no-fund


      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/' android/variables.gradle
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/' android/variables.gradle
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/' android/variables.gradle
          sed -i 's/applicationId ".*"/applicationId "com.ctrlbizdee.hangiulkehangibayrak"/' android/app/build.gradle
          sed -i 's/versionCode 1/versionCode 3/' android/app/build.gradle
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          unzip -o android_icon_assets.zip -d android/app/src/main/res/

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"

          cat > signing.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          cat >> app/build.gradle <<'EOF'

          def signingProps = new Properties()
          signingProps.load(new FileInputStream(rootProject.file("signing.properties")))

          android {
              signingConfigs {
                  release {
                      storeFile file(signingProps['storeFile'])
                      storePassword signingProps['storePassword']
                      keyAlias signingProps['keyAlias']
                      keyPassword signingProps['keyPassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: signed-aab-for-google-play
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
