:'off')}}async function ranking(){app.innerHTML=`<div class="panel"><h2>${t('ranking')}</h2><div class="leader"><b>${t('total')}</b><b>${number(Number(localStorage.getItem('totalV3')||0))}</b></div><div id="rankRows"></div><p class="note">Dünya genelindeki oyuncuların en iyi puanları.</p><button class="btn primary full" onclick="home()">${t('menu')}</button></div>`;const {data,error}=await db.from('world_leaderboard').select('username,game_mode,best_score').order('best_score',{ascending:false}).limit(35);document.getElementById('rankRows').innerHTML=error?'<p>Sıralama yüklenemedi: '+safe(error.message)+'</p>':(data||[]).map((u,i)=>`<div class="leader"><b>${i+1}. ${safe(u.username)} (${safe(u.game_mode)})</b><b>${number(u.best_score)} puan</b></div>`).join('')||'<p>Henüz puan yok.</p>';}function start(m){if(left()<=0){showOverlay(t('timeUp'),t('timeUpDesc'));return}mode=m;order=shuffle(countries);index=0;score=0;active=true;nextQuestion()}function nextQuestion(){clearInterval(clock);if(index>=order.length){finish(true);return}let n=index+1;if(n>1&&n%5===0){let special=n===35;showOverlay(`${special?t('legend'):t('stage')} · ${n}`,`${n}. ${t('stageDesc')} +${number(points(n))}`,()=>renderQuestion());return}renderQuestion()}function renderQuestion(preserve=false){if(!active)return;clearInterval(clock);let n=index+1,c=order[index],others=shuffle(countries.filter(x=>x.code!==c.code)).slice(0,3),choices=shuffle([c,...others]);if(preserve&&window.currentChoices)choices=window.currentChoices;window.currentChoices=choices;app.innerHTML=`<div class="stats"><div class="stat"><b>${number(score)}</b><span>${t('series')}</span></div><div class="stat"><b id="daytime">${fmt(left())}</b><span>${t('daily')}</span></div><div class="stat"><b>${number(points(n))}</b><span>${t('points')}</span></div></div><div class="panel"><div class="row"><span class="pill">${mode==='country'?t('country'):t('flag')}</span><span class="pill"><span id="sec">10.0</span>s</span></div><div class="questionhead"><div class="eyebrow">${t('question')}</div><div class="number">${number(n)} <small>/ ${number(order.length)}</small></div>${n%5===0?`<div>×${points(n)/n} BONUS</div>`:''}</div><div class="progress"><div style="width:${index/order.length*100}%"></div></div><div class="hero"><div class="prompt">${mode==='country'?t('whichCountry'):t('whichFlag')}</div>${mode==='country'?`<div class="flaghero"><img src="${flag(c)}" alt="" onerror="this.alt='Flag image unavailable'"></div>`:`<div class="countryhero">${safe(name(c))}</div>`}</div><div class="timer" style="margin-top:16px"><div id="bar" style="width:100%"></div></div><div class="options">${choices.map((v,i)=>`<button class="btn option" data-i="${i}">${mode==='country'?safe(name(v)):`<img src="${flag(v)}" alt="${safe(name(v))}" onerror="this.alt='Flag unavailable'">`}</button>`).join('')}</div><div class="message" id="message"></div></div>`;let buttons=[...document.querySelectorAll('.option')];buttons.forEach((b,i)=>b.onclick=()=>answer(i,choices,buttons));locked=false;questionStart=performance.now();let last=questionStart;clock=setInterval(()=>{let now=performance.now(),delta=now-last;last=now;consume(delta);let rem=Math.max(0,10000-(now-questionStart));document.getElementById('sec').textContent=(rem/1000).toFixed(1);document.getElementById('bar').style.width=`${rem/100}%`;document.getElementById('daytime').textContent=fmt(left());if(rem===0)answer(-1,choices,buttons)},50)}function answer(chosen,choices,buttons){if(locked)return;let elapsed=performance.now()-questionStart;if(elapsed>=10000)chosen=-1;locked=true;clearInterval(clock);let correct=chosen>=0&&choices[chosen].code===order[index].code;buttons.forEach((b,i)=>{b.disabled=true;if(choices[i].code===order[index].code)b.classList.add('good');else if(i===chosen)b.classList.add('bad')});sound(correct);let msg=document.getElementById('message');if(correct){let n=index+1,mult=speedMult(elapsed),gain=points(n)*mult;score+=gain;msg.textContent=`${t('correct')} +${number( const banned=['hitler','nazi','nazist','terrorist','terorist','ırkçı','irkci','racist','pedofil','pedophile','fuck','siktir','orospu','piç','pic','amk','nigger','kike','faggot','puta','kurva','сука','бляд','нацист'];
function nicknameError(v){
 const s=v.normalize('NFKC').trim();
 if(!/^[\p{L}\p{N}]{3,20}$/u.test(s))return '3–20 harf veya rakam kullanın; boşluk ve özel karakter kullanmayın.';
 const norm=s.toLocaleLowerCase().normalize('NFKD').replace(/\p{M}/gu,'').replace(/[013457]/g,c=>({'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t'}[c]));
 if(banned.some(x=>norm.includes(x)))return 'Bu kullanıcı adına izin verilmiyor.';
 return '';
}

// Kullanıcı adı, yalnızca Supabase Auth'un dahili giriş kimliğine dönüştürülür.

function loginIdentity(n){
 const bytes=new TextEncoder().encode(n.normalize('NFKC').toLowerCase());
 return 'u'+Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')+'@players.example.com';

function authScreen(){
 app.innerHTML=`<div class="panel auth"><h2>Oyuncu Girişi</h2><p class="note">Kullanıcı adın ve şifrenle giriş yap. E-posta gerekmez.</p><label for="nick">Kullanıcı adı</label><input id="nick" maxlength="20" autocomplete="username" placeholder="Örneğin BayrakUstası"><label for="pass">Şifre (en az 6 karakter)</label><input id="pass" type="password" minlength="6" autocomplete="current-password" placeholder="Şifren"><p class="error" id="authError" role="alert"></p><button class="btn primary full" id="login">Giriş Yap</button><button class="btn full" id="register" style="margin-top:10px">Yeni Hesap Oluştur</button><p class="note">Şifreni unutursan e-posta olmadan otomatik kurtarma yapılamaz.</p></div>`;

  const err=nicknameError(nick)||(password.length<6?'Şifre en az 6 karakter olmalı.':'');
  if(err){errEl.textContent=err;return}
  loginBtn.disabled=registerBtn.disabled=true;errEl.textContent='İşlem yapılıyor...';
  try{
   const email=loginIdentity(nick);
   if(register){
    const {data,error}=await db.auth.signUp({email,password,options:{data:{username:nick}}});
    if(error)throw error;
    if(!data.session){errEl.textContent='Hesap oluşturuldu ancak oturum açılamadı. Supabase Authentication > Email > Confirm email ayarını kapatıp yeniden dene.';return}
    currentUser=data.user;
    // SQL tetikleyicisi profil oluşturur. Eşzamanlılık için kısa süre bekleyerek oku.
    await loadProfile();
    if(currentNick!==nick){
     const {error:profileError}=await db.from('profiles').upsert({id:currentUser.id,username:nick},{onConflict:'id'});
     if(profileError)throw profileError;
     await loadProfile();
    }
   }else{
    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error)throw error;
    currentUser=data.user;await loadProfile();
   }
   home();
  }catch(e){errEl.textContent=e.message?.includes('Invalid login credentials')?'Kullanıcı adı veya şifre hatalı.':e.message?.includes('User already registered')?'Bu kullanıcı adı zaten kayıtlı.':(e.message||'Bağlantı hatası. Tekrar dene.');}
  finally{loginBtn.disabled=registerBtn.disabled=false}
 }
 loginBtn.onclick=()=>submit(false);registerBtn.onclick=()=>submit(true);
 passEl.addEventListener('keydown',e=>{if(e.key==='Enter')submit(false)});
}
